[project]
name = "flight-price-observatory"
version = "0.1.0"
description = "Flight Price Observatory is an automated data engineering and analytics platform designed to continuously collect, store, and analyse historical airfare pricing data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flights>=0.9.0",
    "tqdm>=4.66.0",
    "aiosqlite>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.17.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
addopts = "--cov=collector --cov-report=term-missing --cov-report=html --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["collector"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
