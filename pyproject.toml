[project]
name = "flight-price-observatory"
version = "0.1.0"
description = "Flight Price Observatory is an automated data engineering and analytics platform designed to continuously collect, store, and analyse historical airfare pricing data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flights @ git+https://github.com/olivierbarbosa/fli@fix/wire-framing-and-error-envelope",
    "aiosqlite>=0.21.0",
    "boto3>=1.38.0",
    "duckdb>=1.4.0",
]

[project.scripts]
lint = "scripts.lint:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "collector"
module-root = ""

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.17.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
addopts = "--cov=collector --cov-report=term-missing --cov-report=html --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["collector"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
include = ["."]
exclude = ["htmlcov", "storage", ".venv", "tests", "stubs"]
stubPath = "stubs"

