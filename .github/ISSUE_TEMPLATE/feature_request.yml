name: Feature Request
description: Suggest new functionality
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New provider
        - New route
        - New CLI command
        - Pipeline improvement
        - Other
    validations:
      required: true
